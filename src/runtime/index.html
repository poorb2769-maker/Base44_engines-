<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base44 Engine - Runtime</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      overflow: hidden;
    }
    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #viewport {
      flex: 1;
      position: relative;
    }
    #controls {
      background: #2d2d30;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #3e3e42;
    }
    .control-button {
      background: #3e3e42;
      border: none;
      color: #cccccc;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .control-button:hover {
      background: #4e4e54;
    }
    #stats {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #00ff00;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="viewport"></div>
    <div id="controls">
      <button class="control-button" id="btn-play">▶ Play</button>
      <button class="control-button" id="btn-pause">⏸ Pause</button>
      <button class="control-button" id="btn-stop">⏹ Stop</button>
    </div>
  </div>

  <div id="stats">
    <div id="fps">FPS: 0</div>
    <div id="memory">Memory: 0 MB</div>
    <div id="entities">Entities: 0</div>
  </div>

  <canvas id="ui-canvas" width="800" height="600" style="display: none;"></canvas>

  <script type="module" src="./runtime.ts"></script>
</body>
</html>
